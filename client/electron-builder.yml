appId: com.harmony.client
productName: Harmony
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: build

# Where updates come from. With this set, every build writes
# resources/app-update.yml into the app (what electron-updater reads at
# runtime) and latest.yml / latest-linux.yml into dist/ -- even with
# `--publish never`, which is how CI builds: the release itself is created by
# one job in .github/workflows/release.yml, so three parallel builds never
# race to create it. The repo is public, so clients need no token to read it.
publish:
  provider: github
  owner: PedroLucasMiguel
  repo: harmony
  releaseType: release

# Effectively unused. The NSIS installer's payload is archived by 7-Zip at
# -mx=9 whatever this says, and the one thing that overrides it -- the
# ELECTRON_BUILDER_COMPRESSION_LEVEL environment variable -- overrides this
# too. scripts/build.js always sets it: 3 for `npm run build`, 9 for
# `npm run build:release`. See that file for the measurements.
compression: normal

# The one native dependency, loopback-capture, ships N-API prebuilds -- they
# load in any Electron with no rebuild. Asking electron-builder to rebuild
# native modules anyway walks the whole dependency tree for nothing.
npmRebuild: false

# Chromium ships 55 locale files, ~49 MB of them, and Harmony's UI is English
# only -- so 54 of them are pure weight. This is the single biggest saving
# available, and it is a supported option rather than a trick.
electronLanguages:
  - en-US

# Deletes runtime pieces Harmony does not use; see the file for what and why.
afterPack: scripts/after-pack.js

# macOS only: signs with the release certificate when the build machine has it
# (see the `mac` block).
afterSign: scripts/after-sign.js

files:
  - src/**/*
  - package.json
  - '!**/*.map'
  # Nothing in the app tree needs these, and they travel with dependencies.
  - '!**/{test,tests,__tests__,example,examples,docs,doc}/**'
  - '!**/*.{md,markdown,ts,flow,patch,log}'
  - '!**/{.editorconfig,.nycrc,.prettierrc,.eslintrc,tsconfig.json,CMakeLists.txt}'
  # The camera background's runtime ships in three WebAssembly builds of about
  # 13 MB each. Chromium has SIMD, so the plain one is the only one ever loaded
  # (the module build is for workers, which this does not use).
  - '!node_modules/@mediapipe/tasks-vision/wasm/vision_wasm_nosimd_internal.*'
  - '!node_modules/@mediapipe/tasks-vision/wasm/vision_wasm_module_internal.*'
  - '!node_modules/@mediapipe/tasks-vision/vision_bundle.{cjs,js}'

# `loopback-capture` resolves its .node binary from the filesystem via the
# `bindings` package, which cannot see inside an asar archive. Unpacking it is
# what makes per-application audio work in a packaged build.
asarUnpack:
  - node_modules/loopback-capture/**

# The app icon, from media/iso.png -- regenerate with
# `python client/scripts/make-icons.py` after changing the logo.
win:
  icon: build/icon.ico
  # An installer, not the self-extracting `portable` .exe used up to 2.9.
  #
  # The portable build unpacked ~300 MB of Chromium into %TEMP% on EVERY
  # launch before the app could start: seconds of LZMA decompression, and
  # then Windows Defender scanning all of it as freshly written, unsigned
  # executables -- every time. A self-extracting unsigned packer is also
  # exactly the shape antivirus heuristics distrust, which is where the
  # false positives came from.
  #
  # Installed, the files are written and scanned once and the app starts
  # like any other. See the `nsis` block for why it still needs no admin.
  target:
    - nsis
  artifactName: Harmony-${version}-setup.exe
  # Never ask for elevation. Nothing Harmony does needs it, and an unsigned
  # program asking for admin is the other thing that gets flagged.
  requestedExecutionLevel: asInvoker

nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # Per-user, one click: installs into %LOCALAPPDATA%\Programs\Harmony with
  # no UAC prompt, the same no-admin promise the portable build made.
  oneClick: true
  perMachine: false
  allowElevation: false
  # elevate.exe is a UAC helper electron-builder ships into resources/ by
  # default. A per-user install never elevates, so it would sit there unused
  # -- and a standalone elevation tool inside an unsigned app is a classic
  # antivirus false positive.
  packElevateHelper: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Harmony
  # Settings, the session and the media cache live in %APPDATA%; an update
  # (which is an uninstall and reinstall underneath) must not take them.
  deleteAppDataOnUninstall: false
  # The .blockmap is for electron-updater's differential downloads. Without
  # it an update downloads the whole installer (~86 MB) rather than the parts
  # that changed -- which is nearly all of it anyway when Electron itself
  # moves. Turning it on is a little build time and one more release file.
  differentialPackage: false

linux:
  icon: build/icon.png
  # The binary's name inside the AppImage. Left unset it comes from the
  # package name, "@harmony/client", which electron-builder refuses as a
  # file name. Windows and macOS name theirs after productName instead.
  executableName: harmony
  target:
    - AppImage
  category: Network
  artifactName: Harmony-${version}-${arch}.AppImage

mac:
  # 1024 px PNG; electron-builder makes the .icns from it.
  icon: build/icon.png
  # The .dmg is the first install. The .zip is what updates come from:
  # electron-updater on macOS downloads it and hands it to Squirrel.Mac, and
  # will not read a .dmg.
  target:
    - dmg
    - zip
  # One of each per architecture; CI builds both (--x64 --arm64).
  artifactName: Harmony-${version}-${arch}.${ext}
  # Signed ad-hoc ("-") here, and again by scripts/after-sign.js with the
  # project's own self-signed certificate wherever HARMONY_MAC_SIGN_HASH points
  # at one (the release workflow does; see scripts/make-mac-signing-cert.sh).
  #
  # Why not leave it ad-hoc: that signature has no identity, so its designated
  # requirement is the hash of that one build. To macOS every release is then a
  # new app -- Screen Recording, Camera and Microphone are granted all over
  # again -- and Squirrel.Mac, which only swaps an app for one that satisfies
  # the old one's requirement, refuses the update outright. A certificate makes
  # the requirement "signed by this certificate", the same on every release.
  #
  # Why ad-hoc here at all: an Apple Silicon Mac will not run an arm64 app with
  # no signature, and a build made without the certificate (a fork, a local
  # build) still has to run. Hardened runtime only matters for notarization,
  # and would refuse Electron's frameworks under either, so off.
  #
  # Self-signed is not Developer ID: Gatekeeper still asks on the first open
  # (right-click, Open). Updates the app fetches itself carry no quarantine
  # flag, so they are not asked about.
  identity: '-'
  hardenedRuntime: false
  category: public.app-category.social-networking
  # The ScreenCaptureKit helper that keeps one app out of a screen share's
  # audio, built by scripts/build-native.js. In Resources/ rather than inside
  # the asar, because it is run as a program.
  extraResources:
    - from: build/native/harmony-audio-capture
      to: harmony-audio-capture
  # Screen and audio capture need these on macOS 10.15+.
  extendInfo:
    NSCameraUsageDescription: Harmony can share a webcam or capture card as your video source.
    NSMicrophoneUsageDescription: Harmony captures audio so viewers can hear your shared screen or window.
