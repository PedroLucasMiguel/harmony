import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

/*
 * The version is client/package.json's, so the APK, the desktop builds and
 * the release tag can never disagree. versionCode is what Android compares
 * to allow an update: 3.1.0 -> 30100, so it only ever goes up.
 */
def clientPackage = new JsonSlurper().parse(file('../../package.json'))
def appVersion = clientPackage.version as String
def versionParts = appVersion.tokenize('.-').take(3).collect { it.isInteger() ? it.toInteger() : 0 }
def appVersionCode = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]

/*
 * Release signing, from the environment -- CI writes the keystore from a
 * repository secret (see .github/workflows/release.yml). The SAME key has to
 * sign every release, or Android refuses to install one over another.
 * Without it the release build is left unsigned and CI falls back to a
 * debug build, which installs but cannot be updated in place.
 */
def keystorePath = System.getenv('HARMONY_KEYSTORE')
def hasReleaseKey = keystorePath && file(keystorePath).exists()

android {
    namespace = "com.harmony.client"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.harmony.client"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The WebRTC library ships native code for every ABI; phones are ARM,
        // and leaving the emulator ABIs out keeps the APK about 20 MB smaller.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('HARMONY_KEYSTORE_PASSWORD')
                keyAlias System.getenv('HARMONY_KEY_ALIAS')
                keyPassword System.getenv('HARMONY_KEY_PASSWORD') ?: System.getenv('HARMONY_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseKey) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Screen sharing: Android's WebView cannot capture the screen, so that
    // one stream is published by a native WebRTC stack. See ScreenShare.java.
    implementation "io.getstream:stream-webrtc-android:1.3.10"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
