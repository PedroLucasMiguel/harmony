# A release, built for every OS and published -- from one tag.
#
#   1. bump "version" in client/package.json and commit
#   2. git tag v3.1.0 && git push origin v3.1.0
#
# The tag has to match the version exactly, or nothing is published: the
# installed apps compare versions from latest.yml, which is built from
# package.json, and a release named one thing holding another would offer an
# update forever or never.
#
# Three builds run side by side and only upload what they made. One last job
# creates the GitHub Release with all of it, so there is never a race between
# builds to create it. Running clients find it within six hours (see
# client/src/main/updater.js).

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows
            os: windows-latest
            targets: --win nsis
          - name: linux
            os: ubuntu-latest
            targets: --linux AppImage
          - name: macos
            os: macos-latest
            targets: --mac dmg --x64 --arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Tag matches the version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match client/package.json version $version (expected v$version)."
            exit 1
          fi

      - run: npm ci

      # --publish never: this job only builds. The publish config in
      # electron-builder.yml still makes it write latest*.yml into dist/.
      - name: Build
        run: node scripts/build.js release ${{ matrix.targets }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: harmony-${{ matrix.name }}
          if-no-files-found: error
          path: |
            client/dist/*.exe
            client/dist/*.AppImage
            client/dist/*.dmg
            client/dist/latest*.yml

  # The Android app, signed with the project's key so each release installs
  # over the last. The key comes from four repository secrets (see
  # client/android/README.md); without them this job builds nothing and says
  # so, and the desktop release goes out without an APK.
  android:
    name: Build (android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
        shell: bash
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Tag matches the version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match client/package.json version $version (expected v$version)."
            exit 1
          fi

      - name: No signing key
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so this release has no APK. See client/android/README.md."

      - if: env.KEYSTORE_BASE64 != ''
        run: npm ci

      - name: Web client into the Android project
        if: env.KEYSTORE_BASE64 != ''
        run: npm run android:sync

      - name: Build and sign
        if: env.KEYSTORE_BASE64 != ''
        working-directory: client/android
        env:
          HARMONY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HARMONY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HARMONY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export HARMONY_KEYSTORE="$RUNNER_TEMP/harmony.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$HARMONY_KEYSTORE"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          rm -f "$HARMONY_KEYSTORE"
          version=$(node -p "require('../package.json').version")
          mkdir -p ../dist
          mv app/build/outputs/apk/release/app-release.apk "../dist/Harmony-$version.apk"

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_BASE64 != ''
        with:
          name: harmony-android
          if-no-files-found: error
          path: client/dist/*.apk

  publish:
    name: Publish the release
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - run: ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
